name: Desktop CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    needs: contract-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:dir
      - uses: actions/upload-artifact@v4
        with:
          name: methodmesh-desktop-${{ runner.os }}
          path: dist
          if-no-files-found: error
          retention-days: 7
